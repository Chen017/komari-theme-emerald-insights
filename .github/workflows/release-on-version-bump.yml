name: Theme CI and Release

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - AGENTS.md
      - src/AGENTS.md
      - 'docs/**/*.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and verify package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.release_tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release decisions
        run: node --test scripts/release.test.mjs
      - name: Detect installable changes
        id: plan
        if: github.repository == 'Chen017/komari-theme-emerald-insights' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          node scripts/release.mjs plan "$latest_tag" >> "$GITHUB_OUTPUT"
      - name: Prepare version for verification
        id: version
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
        run: |
          node scripts/release.mjs prepare "$RELEASE_VERSION"
          git add -- package.json komari-theme.json
          if ! git diff --cached --quiet; then
            release_date=$(git show -s --format=%cI "$GITHUB_SHA")
            GIT_AUTHOR_DATE="$release_date" GIT_COMMITTER_DATE="$release_date" \
              git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "chore(release): $RELEASE_TAG"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Bun is installed from npm with retries after previous GitHub download failures.
      - name: Install pinned Bun
        run: |
          bun_package=$(node -p "require('./package.json').packageManager")
          npm install --global "$bun_package" --fetch-retries=3 --no-audit --no-fund
          test "$(bun --version)" = "${bun_package#bun@}"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Install Chromium for browser tests
        run: bun run playwright install --with-deps --only-shell chromium
      - name: Run browser tests
        id: browser
        run: bun run test:browser
      - name: Store browser failure traces
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Store verified ZIP
        if: steps.plan.outputs.publish == 'true' || github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-package
          path: komari-theme-emerald-insights.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified ZIP
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-package
          path: release
      - name: Commit verified version and create tag
        id: tag
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          node scripts/release.mjs prepare "$RELEASE_VERSION"
          git add -- package.json komari-theme.json
          if ! git diff --cached --quiet; then
            release_date=$(git show -s --format=%cI "$GITHUB_SHA")
            GIT_AUTHOR_DATE="$release_date" GIT_COMMITTER_DATE="$release_date" \
              git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "chore(release): $RELEASE_TAG"
          fi
          commit_sha=$(git rev-parse HEAD)
          [[ "$commit_sha" == "$EXPECTED_SHA" ]] || { echo "Verified version commit does not match." >&2; exit 1; }
          tag_ref="refs/tags/$RELEASE_TAG"
          tags=$(git ls-remote origin "$tag_ref" "$tag_ref^{}")
          tag_sha=$(awk -v ref="$tag_ref" '$2 == ref {sha=$1} $2 == ref "^{}" {peeled=$1} END {print (peeled ? peeled : sha)}' <<< "$tags")
          if [[ -n "$tag_sha" ]]; then
            [[ "$tag_sha" == "$commit_sha" ]] || { echo "Tag $RELEASE_TAG already targets $tag_sha." >&2; exit 1; }
          fi
          git push origin "HEAD:refs/heads/master"
          if [[ -z "$tag_sha" ]]; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$commit_sha" -m "Release $RELEASE_TAG"
            git push origin "$tag_ref"
          fi
          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/komari-theme-emerald-insights.zip
