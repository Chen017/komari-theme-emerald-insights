name: Theme CI and Release

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - AGENTS.md
      - src/AGENTS.md
      - 'docs/**/*.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  verify:
    name: Test and verify theme package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      # Use npm registry retries to avoid depending on GitHub Bun asset downloads.
      - name: Install pinned Bun
        run: |
          bun_package=$(node -p "require('./package.json').packageManager")
          npm install --global "$bun_package" --fetch-retries=3 --no-audit --no-fund
          test "$(bun --version)" = "${bun_package#bun@}"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Install Chromium for browser tests
        run: bun run playwright install --with-deps --only-shell chromium
      - name: Run browser tests
        id: browser
        run: bun run test:browser
      - name: Store browser failure traces
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check whether this version needs its release ZIP
        id: release
        if: github.repository == 'Chen017/komari-theme-emerald-insights' && github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: komari-theme-emerald-insights.zip
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          tag="v$version"
          response="$RUNNER_TEMP/release.json"
          error_log="$RUNNER_TEMP/release-error.txt"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$response" 2> "$error_log"; then
            asset_state=$(node -e 'const release = require(process.argv[1]); console.log(release.assets.some(asset => asset.name === process.env.RELEASE_ZIP && asset.state === "uploaded" && asset.size > 0) ? "present" : "missing")' "$response")
            if [[ "$asset_state" == present ]]; then
              echo "$tag already has a published ZIP."
              exit 0
            fi
          elif ! grep -q 'HTTP 404' "$error_log"; then
            cat "$error_log" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Store verified ZIP
        if: steps.release.outputs.tag != '' || github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: komari-theme-emerald-insights
          path: komari-theme-emerald-insights.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified theme ZIP
    needs: verify
    if: needs.verify.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: theme-release-${{ needs.verify.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: komari-theme-emerald-insights
          path: release
      - name: Create or verify release tag
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          tags=$(git ls-remote origin "$tag_ref" "$tag_ref^{}")
          tag_sha=$(awk -v ref="$tag_ref" '$2 == ref {sha=$1} $2 == ref "^{}" {peeled=$1} END {print (peeled ? peeled : sha)}' <<< "$tags")
          if [[ -n "$tag_sha" ]]; then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already targets $tag_sha, expected $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "$tag_ref"
          fi
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          name: ${{ needs.verify.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/komari-theme-emerald-insights.zip
